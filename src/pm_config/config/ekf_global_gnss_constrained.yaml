ekf_global_gnss_constrained_node:
  ros__parameters:
    # This filter owns map-frame position. It deliberately does not consume
    # /odometry/local pose, because that pose is an already-correlated summary
    # of wheel/IMU/VIO and can otherwise overpower 1 Hz GNSS corrections.
    frequency: 20.0
    sensor_timeout: 1.0
    two_d_mode: false
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Wheel supplies only measured forward body velocity.
    odom0: /wheel/odometry
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # Keep vehicle attitude without accepting magnetic yaw directly. Roll and
    # pitch are gravity-referenced; yaw evolves from gyro z until a separately
    # validated one-time heading seed is available.
    imu0: /wit/imu
    imu0_config: [
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false

    # VIO contributes only relative horizontal velocity after its health gate.
    # Its pose, orientation, z, and vz are excluded from the global filter.
    odom1: /vio/odometry/twist_gated
    odom1_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom1_queue_size: 20
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 5.0

    # GNSS is the only global position observation. z remains excluded until
    # the GNSS quality gate (step 5) can evaluate altitude reliability.
    odom2: /odometry/gps
    odom2_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom2_queue_size: 5
    odom2_differential: false
    odom2_relative: false
