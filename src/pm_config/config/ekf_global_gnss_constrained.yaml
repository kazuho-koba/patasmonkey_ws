ekf_global_gnss_constrained_node:
  ros__parameters:
    # このfilterはmap座標系の位置を担当する。wheel/IMU/VIOを既に相関付きで要約した
    # /odometry/local poseは、1 Hz GNSS補正を押し負かし得るため意図して入力しない。
    frequency: 20.0
    sensor_timeout: 1.0
    # 高さ・傾斜はlocal観測器と合成する。未観測のz/vzが水平状態へ結合しない。
    two_d_mode: true
    # map→odomはglobal odometry composerだけが配信する。
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # wheelからは車体前方速度だけを使う。
    odom0: /wheel/odometry
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # yawは検証された一回限りのheading seedからgyro zで伝播する。
    # roll/pitchはlocal側で別途観測して合成する。
    imu0: /wit/imu
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false

    # VIOは健全性ゲート通過後の相対水平速度だけを与える。pose、orientation、z、vzは
    # global filterから除外する。
    odom1: /vio/odometry/twist_gated
    odom1_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom1_queue_size: 20
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 5.0

    # GNSSを唯一のglobal位置観測とする。zはGNSS品質ゲート（ステップ5）がaltitudeの
    # 信頼性を評価できるまで除外する。
    # 初期化nodeがdatumを検証した後にだけ公開される位置。
    odom2: /odometry/gps
    odom2_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom2_queue_size: 5
    odom2_differential: false
    odom2_relative: false
