ekf_global_gnss_constrained_node:
  ros__parameters:
    # このfilterはmap座標系の位置を担当する。wheel/IMU/VIOを既に相関付きで要約した
    # /odometry/local poseは、1 Hz GNSS補正を押し負かし得るため意図して入力しない。
    frequency: 20.0
    sensor_timeout: 1.0
    two_d_mode: false
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # wheelからは車体前方速度だけを使う。
    odom0: /wheel/odometry
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # 磁気yawを直接採用せずに車体姿勢を保持する。roll/pitchは重力基準で、yawは別途検証
    # された一回限りのheading seedまでgyro zで伝播する。
    imu0: /wit/imu
    imu0_config: [
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false

    # VIOは健全性ゲート通過後の相対水平速度だけを与える。pose、orientation、z、vzは
    # global filterから除外する。
    odom1: /vio/odometry/twist_gated
    odom1_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom1_queue_size: 20
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 5.0

    # GNSSを唯一のglobal位置観測とする。zはGNSS品質ゲート（ステップ5）がaltitudeの
    # 信頼性を評価できるまで除外する。
    odom2: /odometry/gps
    odom2_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom2_queue_size: 5
    odom2_differential: false
    odom2_relative: false
