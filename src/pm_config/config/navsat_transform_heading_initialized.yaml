# localization_mode:=separated_offroadだけで使う。
# heading_initializer_nodeが停止中のlocal yaw seedと有効GNSS fixの両方を得るまで、
# datumは意図して保留する。
navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    delay: 3.0

    # /wit/imu/heading_calibratedには検証済みの取付角・磁北から真北への補正を既に
    # 適用している。ここで二重に補正してはならない。
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0

    zero_altitude: false
    publish_filtered_gps: true
    broadcast_utm_transform: true
    broadcast_utm_transform_as_parent_frame: true

    use_odometry_yaw: false
    wait_for_datum: true
