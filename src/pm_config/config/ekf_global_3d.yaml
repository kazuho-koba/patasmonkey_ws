ekf_global_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 1.0
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    publish_tf: true

    odom0: /odometry/local
    odom0_config: [
      true,  true,  true,
      true,  true,  true,
      true,  true,  true,
      true,  true,  true,
      false, false, false
    ]

    odom1: /odometry/gps
    odom1_config: [
      true,  true,  true,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: false