ekf_local_horizontal_node:
  ros__parameters:
    # このfilterは水平運動だけを担当する。VIOまたは地形の高さがx/y/yaw状態へ結合
    # しないよう2D modeを維持する。
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odometry
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # Wit orientationは融合しない。yawはgyro zだけで伝播する。
    imu0: /wit/imu
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false

    # VIO poseは意図して除外する。twist gateは破綻・再起動したVIOを隔離し、安定した
    # 相対vx/vy観測だけを再投入できる。
    odom1: /vio/odometry/twist_gated
    odom1_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom1_queue_size: 20
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 5.0
