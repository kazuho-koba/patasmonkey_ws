# separated_offroad profile用の地球基準heading初期化。
#
# yaw_correction_radiansは座標規約を検証した後の/wit/imu ROS yawへ加える。ROS ENU
# 規約（0=east、反時計回り正）における磁気偏角とWIT-to-base_link取付角の合成補正を
# 表す。停止・再現性校正で実測値が得られるまで0.0のままにする。
heading_initializer_node:
  ros__parameters:
    input_imu_topic: /wit/imu
    output_imu_topic: /wit/imu/heading_calibrated
    wheel_odom_topic: /wheel/odometry
    # datum seedにはglobal EKFが採用するものと同じGNSS streamだけを使う。
    gnss_fix_topic: /fix/gated
    # robot_localizationはこのserviceをEKF node名の下ではなくlaunch namespaceに作る。
    local_set_pose_service: /set_pose
    # ROS 2 Foxyのnavsat_transform_nodeはSetDatumを/datumとして公開する。
    navsat_set_datum_service: /datum

    yaw_correction_radians: 0.0
    stationary_speed_threshold_mps: 0.03
    # Witの公称100 Hzでは、これは1秒間の停止時平均に相当する。
    initial_sample_count: 100
    max_initial_yaw_stddev_radians: 0.10
    initialization_timeout_sec: 12.0
    initial_yaw_variance: 0.05
