vehicle_interface_node:
  ros__parameters:

    # odrive
    odrv_usb_port: "/dev/serial/by-id/usb-ODrive_Robotics_ODrive_3.6_CDC_Interface_205139964D4D-if00"
    odrv_baud_rate: 115200

    # topics
    cmd_vel_topic: "/cmd_vel_autonomy"  # 自律側入力。/cmd_velは選択・制約適用後の記録用出力。
    cmd_vel_joy_topic: "/cmd_vel_joy"
    mtr_output_topic: "/motor_cmd"

    emergency_stop_topic: "/emergency_stop"

    # odrive axis
    mtr_axis_l: 0
    mtr_axis_r: 1

    # gains
    vel_ramp_rate: 35.0
    pos_gain: 30.0
    vel_gain: 0.225
    vel_integrator_gain: 0.75
    vel_integrator_limit: 2.0

    # state
    motor_state_topic: "/motor_state"
    # 速度指令の選択・ODrive送信周期。10〜25 Hz、変更後はnode再起動。
    # モータ位置・速度・電流の取得周期（既定30 Hz）には影響しない。
    motor_command_rate_hz: 10.0


    #################################################
    # motor direction
    #################################################

    # 正方向補正
    #
    # 前進指令時:
    #   +1.0 -> 正回転
    #   -1.0 -> 反転
    #
    left_motor_sign: 1.0
    right_motor_sign: -1.0


    #################################################
    # turn / yaw constraints
    #################################################

    # 最小旋回半径 [m]
    #
    # 信地旋回・超信地旋回を避けるための制約。
    # tread_width=0.36m, min_turn_radius=0.5m の場合、
    # 最大旋回時でも内側ホイールは停止せず回転する。
    #
    min_turn_radius: 0.4

    # 実際の車体yaw / 左右輪速度差から求める理想yaw（無次元、0 < 値 <= 1）。
    # 0.5は同じ車体yawに輪差2倍が必要という仮置き。1.0で従来の差動駆動式。
    # 車体目標を制約してから輪差へ変換し、補正後のyawレート/加速度も下記上限内に保つ。
    # 上限に達する場合は速度も低下する。係数は路面・速度・荷重で変わるため実測調整が必要。
    # 内輪を逆転・停止させない予測半径は max(min_turn_radius, tread_width/(2*係数)+微小余裕)。
    # 輪距0.36 m、係数0.5では約0.36 m未満の半径は実現しない。変更後はnode再起動。
    skid_steer_yaw_efficiency: 0.5

    # 全モードに共通する車体中心の絶対速度上限 [m/s]。
    # 通常・Turbo・自律を分け、通常の斜め入力でも通常上限を超えない。
    max_linear_speed: 2.0
    joy_normal_max_linear_speed: 1.0
    joy_turbo_max_linear_speed: 2.0
    autonomous_max_linear_speed: 1.0

    # Twistにはmode情報がないため、既存JoyのボタンでTurboを明示的に判定する。
    # ボタン番号はpm_teleop/config/teleop_twist_joy.yamlのenable_turbo_buttonと揃える。
    # Joy未受信・0.3秒以上古い場合は通常モードへ戻す。
    joy_state_topic: "/pm/joy"
    joy_turbo_button: 1

    # 最大ヨーレート [rad/s]
    #
    # Visual Odometryがyaw回転で破綻しにくくなるように制限する。
    # 1.0 rad/s ≒ 57.3 deg/s。0でyaw上限制限と旋回速度の減速計算を無効化する。
    # 予測車体yawと補正後の輪差yawの両方に適用。係数0.5なら予測車体上限は0.5倍。
    # 旋回時の目標速度は曲率と補正後にも実現可能な上限から滑らかに計算する。
    #
    max_yaw_rate: 1.0

    # 最大ヨー加速度 [rad/s^2]
    #
    # yaw rateの立ち上がり・立ち下がりを制限する。
    # 補正後の輪差yawにも同じ制限を適用する（予測車体側では係数倍）。
    # 前後速度の変化率はこの値×min_turn_radius [m/s^2]を基準とし、
    # 旋回時は係数×この値/|曲率|以下へ追加制限する。直進時は従来どおり。
    # 0は両方の変化率制限を無効化する。停止・半径/yaw上限は変化率より優先する。
    #
    max_yaw_accel: 1.0

    #################################################
    # joystick turn mapping
    #################################################

    # この角度で最大旋回強度に到達する [deg]
    #
    # 0deg: 前後まっすぐ
    # 45deg: 最大旋回
    #
    joy_max_turn_angle_deg: 45.0

    # この角度以上は真横入力扱いとして停止する [deg]
    #
    # joy_max_turn_angle_deg〜joy_side_stop_angle_deg の間は、
    # 最大曲率を維持し、速度はyaw制約から適応的に落とす。
    #
    joy_side_stop_angle_deg: 80.0
