gnss_fix_gate_node:
  ros__parameters:
    # 生receiver streamは診断用に記録し続ける。separated_offroad modeで
    # navsat_transformが使うのはgate後のcopyだけである。
    input_fix_topic: /fix
    navpvt_topic: /navpvt
    output_fix_topic: /fix/gated
    diagnostics_topic: /gnss/fix_gate/diagnostics

    require_navpvt: true
    navpvt_timeout_sec: 2.5
    minimum_satellites: 6
    maximum_horizontal_accuracy_m: 20.0

    # Patasmonkeyの指令上限2 m/sに、timestamp jitterとGNSSノイズの余裕を加える。
    # それでも大きな位置ジャンプは棄却する。
    maximum_receiver_speed_mps: 5.0
    jump_margin_m: 3.0
    consecutive_fixes_required: 3

    # non-fixed解は意図して弱い観測としてのみ使う。下限は水平1σであり、receiver報告の
    # h_accとNavSatFix共分散の最大値を採用する。
    fixed_covariance_floor_m: 0.5
    float_covariance_floor_m: 2.0
    standalone_covariance_floor_m: 10.0
