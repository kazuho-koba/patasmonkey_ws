wit_mag_corrector:
  ros__parameters:
    # 2026-10-27の静止8方向と真北から求めた暫定値。raw register単位。
    # ジャイロを参考にした水平面の推定で、z biasは同定できていない。
    # 持ち上げ回転中にジャイロとの差が最大約20度あり、傾斜・実走行では未検証。
    # GUIおよび補正topicの参考値であり、航法用としての精度は保証しない。
    bias: [-1150.9216, -1056.3947, 0.0]
    scale: [1.0, 0.972729, 1.0]
    # 真北を基準に求めた方位offsetには偏角も含まれる。別途偏角を加算しない。
    # これらはGUIの方位計算用で、磁気ベクトルそのものには適用しない。
    offset_deg: -12.9701
    declination_deg: 0.0
    calibrated: false
