wit_mag_corrector:
  ros__parameters:
    # 実機試験用の既定暫定値。2026-11-05に3bagのGNSS直進方位から水平校正。
    # 磁場は (raw - bias) * scale で補正する。単位はWit raw registerのまま。
    # 7bag中6件で疑似初期化の現行校正より改善したが、1件は悪化した。
    # z bias/scaleは未同定の固定値で、傾斜時・別環境での精度は未保証。
    bias: [-848.3671934327712, -920.9509210915588, 0.0]
    scale: [1.0, 0.8960491777027664, 1.0]
    # offsetは北基準bearingへ加算し、ENU yaw = pi/2 - bearingへ変換する。
    # 磁場ベクトルには適用せず、heading initializerとGUIだけで使用する。
    # 今回はGNSS方位との比較で求めたため、偏角を別途二重加算しない。
    offset_deg: -7.6554087986239985
    declination_deg: 0.0
    calibrated: false

    # 一つ前の暫定校正値（2026-10-27の静止8方向と真北から求めたもの）。
    # 戻す場合は上のbias/scale/offset_degをコメントアウトし、以下の3行を有効化する。
    # 新旧の値を混在させず、同じキーが二重に有効にならないよう切り替える。
    # bias: [-1150.9216, -1056.3947, 0.0]
    # scale: [1.0, 0.972729, 1.0]
    # offset_deg: -12.9701
    # declination_deg: 0.0 と calibrated: false は新旧共通。
    # 一つ前の値もz biasは未同定で、傾斜時・実走行での精度は保証しない。
