ekf_filter_node:
  ros__parameters:
    process_noise_covariance:
      frequency: 50.0
      sensor_timeout: 0.1
      two_d_mode: true

    # ekfがTFを出す？
    publish_tf: true

    # フレームの設定
    map_frame: map
    odom_frame: odom 
    base_link_frame: base_link 
    world_frame: odom 

    # ホイールオドメトリの設定
    odom0: /odom
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    # 15要素（x,y,z,roll,pitch,yaw,vx,vy,vz,vroll,vpitch,vyaw,ax,ay,az）の使用是非
    # いまはホイールオドメトリではx,yとvxのみ使う（yaw, vyawはIMUから取る）
    odom0_config: [
      true, true, false,
      false, false, false,
      true, false, false,
      false, false, false,
      false, false, false
    ]

    # IMUの設定
    imu0: /imu/data
    imu0_queue_size: 50
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    # IMUは姿勢（roll, pitch, yaw）と角速度（特にyaw rate）を使う
    # 加速度はノイズ・バイアスが大きいので最初は切っておく
    imu0_config: [
      false, false, false,
      true, true, true,
      false, false, false,
      true, true, true,
      false, false, false 
    ]


