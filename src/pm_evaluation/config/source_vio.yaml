# VIO-only pose (xyz, roll/pitch/yaw). Do not double-count correlated pose/twist.
# Original local EKF uses VIO twist only; that cannot determine yaw on its own.
/**:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: false
    use_sim_time: true
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /vio/odometry
    odom0_config: [true, true, true, true, true, true, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 200
    odom0_differential: false
    odom0_relative: true
