# Based on pm_config/config/ekf_local_whl_imu_cam.yaml.
# Planar dead reckoning: wheel vx and wheel wz, no absolute pose fusion.
/**:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    use_sim_time: true
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel/odometry
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, true, false, false, false]
    odom0_queue_size: 100
    odom0_differential: false
    odom0_relative: false
