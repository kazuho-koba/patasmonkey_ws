# missionの短時間停滞を吸収する既定QoS。debugは従来のbag_qos.yamlを使用する。
# 実測の約0.5～0.7秒の停滞を基に、画像は約1秒、軽量高レートtopicは1～2秒分。
# RELIABLE publisherが確認済みのtopicのみ明示する。未知のtopicは自動QoSを維持。
# 履歴は欠測保証ではなく、一時的なRAM・待ち時間増加との交換条件である。
/oak/stereo/recording_snapshot:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
/tf_static:
  history: keep_all
  depth: 1
  reliability: reliable
  durability: transient_local
/robot_description:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
