/**:
  ros__parameters:
    # 非駆動PoC。debug出力は車両指令へ接続しない。
    path_topic: /pm/planner/preview/reference_path
    odom_topic: /odometry/global
    base_frame: base_link
    pose_timeout_sec: 0.5
    rate_hz: 10.0
    batch_size: 384
    steps: 25
    iterations: 2
    seed: 42
    temperature: 0.4
    sigma_v: 0.22
    sigma_w: 0.65
    target_speed: 1.0  # 直線での目標速度[m/s]。曲率参照速度により旋回手前から減速する。
    use_reference_speed_profile: true  # 曲率・加減速・終点停止に応じて先の参照点と速度を選ぶ。
    lookahead_m: 0.05  # 折返しでのショートカットを軽減する初期値。
    max_projection_advance: 0.35
    max_path_error: 1.0
    goal_radius: 0.10  # 既存進捗判定の弧長余裕0.15 mより小さく設定。
    yaw_response_gain: 1.0  # interfaceが指令を実現する前提。応答誤差は実験時のみ設定。
    # 候補の参照点距離・方位差・目標速度との差・yaw速度・末端距離の重み。
    path_cost_weight: 4.0
    heading_cost_weight: 0.2
    speed_cost_weight: 0.5
    yaw_cost_weight: 0.015
    terminal_cost_weight: 5.0
    visualize: true
