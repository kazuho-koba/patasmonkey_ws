/**:
  ros__parameters:
    # home.yamlとhome_preview_anchor.yamlは未指定時のデフォルト。
    # 倍速は仮想車体だけに適用し、ROSの/clockは変更しない。
    time_scale: 1.0
    candidate_sample_count: 16  # 表示するサンプル軌道数。0で表示停止。
    candidate_publish_hz: 2.0
    track_spacing_m: 0.15
    track_max_points: 3000
    vehicle_length_m: 0.65  # 視認用の概形。実車の正確な長さではない。
    vehicle_width_m: 0.45
    dt: 0.1
    batch_size: 384
    steps: 25
    iterations: 2
    target_speed: 0.15
    yaw_response_gain: 1.0  # vehicle interfaceが車体の旋回速度を実現する仮定。
    sim_yaw_response_gain: 1.0  # 人工車体の応答。実測を保証しない。
    reference_turn_margin_m: 0.1  # 最小0.3 mに加え、参照Pathは0.4 mとする。
    lookahead_m: 0.05
