# 新producerだけの設定。通常mapperの既定値は変更しない。
/**:
  ros__parameters:
    depth_subscription_reliability: reliable
    depth_subscription_queue_depth: 3
    map_size_x: 8.0
    map_size_y: 8.0
    resolution: 0.1
    min_depth: 0.4
    max_depth: 5.0
    pixel_stride: 4
    debug_publish_rate: 2.0
    hazard_obstacle_height_limit: 0.08  # 暫定試験値[m]。実車限界ではない
    confirmation_window: 3           # セル支持と解除の有効観測数
    clear_min_points: 3
    clear_count_ratio: 0.75          # 最終高点観測のセル点数に対する最低比
    clear_ground_tolerance: 0.03     # 最終高点観測時のセル最小zとの許容差[m]
    allow_fallback_intrinsics: false # 実機ではCameraInfoを待つ。旧bagは明示的に設定する
    publish_debug_pointcloud: false
