operator_console:
  ros__parameters:
    manager:
      backend: ros
      status_topic: /pm/robot_manager/status
      start_service: /pm/robot_manager/start
      stop_service: /pm/robot_manager/stop
      get_status_service: /pm/robot_manager/get_status
      mission_bag_start_service: /pm/robot_manager/mission_bag/start
      mission_bag_stop_service: /pm/robot_manager/mission_bag/stop
      debug_bag_start_service: /pm/robot_manager/debug_bag/start
      debug_bag_stop_service: /pm/robot_manager/debug_bag/stop
      stale_timeout_sec: 3.0
    topics:
      stale_timeout_sec: 2.0
      odometry: /odometry/global
      wheel_odometry: /wheel/odometry
      joy: /pm/joy
      gnss_fix: /fix
      navpvt: /navpvt
      wit_imu: /wit/imu
      wit_mag: /wit/mag
    compass:
      # 北0度・時計回り。偏角0なら磁北基準。既存Witのraw磁気単位でbiasを指定。
      bias: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      offset_deg: 0.0
      declination_deg: 0.0
      calibrated: false
    joystick:
      config_package: pm_teleop
      teleop_config: config/teleop_twist_joy.yaml
      joy_config: config/joy_params.yaml
      # 試験時の左入力に表示を合わせるため、GUI上のX符号だけ反転する。
      axis_display_sign:
        x: -1.0
        y: 1.0
    camera:
      topic: /oak/color/image_raw
    attitude:
      urdf_path: ""
      pixels_per_meter: 240.0
    map:
      online_tiles_enabled: true
      tile_url_template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      user_agent: PatasmonkeyOperatorConsole/0.1
      tile_cache_dir: ~/.cache/pm_gui/osm
      offline_tiles_dir: /workspaces/patasmonkey_ws/maps/xyz
      attribution: © OpenStreetMap contributors
      zoom: 17
      # 取得tileはZ19まで、表示はZ26まで拡大する。
      tile_max_zoom: 19
      max_zoom: 26
      gnss_history_points: 2000
    ui:
      refresh_hz: 4.0
      window_size: [1120, 780]
      fixed_window_size: false
      window_title: Patasmonkey UGV Operator Console
    recording:
      low_disk_gib: 5.0
