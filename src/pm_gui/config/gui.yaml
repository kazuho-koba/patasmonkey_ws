operator_console:
  ros__parameters:
    manager:
      backend: ros
      status_topic: /pm/robot_manager/status
      start_service: /pm/robot_manager/start
      stop_service: /pm/robot_manager/stop
      get_status_service: /pm/robot_manager/get_status
      vehicle_start_service: /pm/robot_manager/vehicle/start
      vehicle_stop_service: /pm/robot_manager/vehicle/stop
      mission_bag_start_service: /pm/robot_manager/mission_bag/start
      mission_bag_stop_service: /pm/robot_manager/mission_bag/stop
      debug_bag_start_service: /pm/robot_manager/debug_bag/start
      debug_bag_stop_service: /pm/robot_manager/debug_bag/stop
      stale_timeout_sec: 3.0
    topics:
      stale_timeout_sec: 2.0
      odometry: /odometry/global
      wheel_odometry: /wheel/odometry
      motor_state: /motor_state
      joy: /pm/joy
      gnss_fix: /fix
      navpvt: /navpvt
      wit_imu: /wit/imu
      wit_mag: /wit/mag
    compass:
      # 北0度・時計回り。偏角0なら磁北基準。既存Witのraw磁気単位でbiasを指定。
      bias: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      offset_deg: 0.0
      declination_deg: 0.0
      calibrated: false
    battery:
      model: BL1860B
      parallel_packs: 2
      capacity_ah_per_pack: 6.0
      stale_timeout_sec: 3.0
      smoothing_time_constant_sec: 5.0
      # 停止5秒後に電圧基準を更新。走行中は正のibusをAh積算し、負電流は無視。
      rest_settle_sec: 5.0
      stationary_command_rps: 0.001
      stationary_velocity_rps: 0.1
      # メーカー保証の閾値ではなく、5S Li-ionを仮定した運用上の注意目安。
      low_voltage_v: 17.0
      critical_voltage_v: 16.0
      high_voltage_v: 21.3
      # 汎用の参考曲線 [pack電圧V, 残量%]。BL1860B実測の校正表ではない。
      voltage_soc_curve:
        - [16.0, 0.0]
        - [16.5, 5.0]
        - [17.5, 10.0]
        - [18.0, 20.0]
        - [18.5, 35.0]
        - [19.0, 50.0]
        - [19.5, 65.0]
        - [20.0, 80.0]
        - [20.5, 90.0]
        - [21.0, 100.0]
    joystick:
      config_package: pm_teleop
      teleop_config: config/teleop_twist_joy.yaml
      joy_config: config/joy_params.yaml
      # 試験時の左入力に表示を合わせるため、GUI上のX符号だけ反転する。
      axis_display_sign:
        x: -1.0
        y: 1.0
    camera:
      # raw画像の遠隔購読はOAK publishを滞らせ得る。表示専用JPEGだけを受信する。
      topic: /oak/preview/image/compressed
      transport: compressed
    attitude:
      urdf_path: ""
      pixels_per_meter: 240.0
    map:
      online_tiles_enabled: true
      tile_url_template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      user_agent: PatasmonkeyOperatorConsole/0.1
      tile_cache_dir: ~/.cache/pm_gui/osm
      offline_tiles_dir: /workspaces/patasmonkey_ws/maps/xyz
      attribution: © OpenStreetMap contributors
      zoom: 17
      # 取得tileはZ19まで、表示はZ26まで拡大する。
      tile_max_zoom: 19
      max_zoom: 26
      gnss_history_points: 2000
    ui:
      refresh_hz: 4.0
      window_size: [1120, 780]
      fixed_window_size: false
      window_title: Patasmonkey UGV Operator Console
    recording:
      low_disk_gib: 5.0
