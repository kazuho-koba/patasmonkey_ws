operator_console:
  ros__parameters:
    manager:
      backend: mock
      status_topic: /pm/robot_manager/status
      start_service: /pm/robot_manager/start
      stop_service: /pm/robot_manager/stop
      get_status_service: /pm/robot_manager/get_status
      stale_timeout_sec: 3.0
    topics:
      stale_timeout_sec: 2.0
      odometry: /odometry/global
      joy: /pm/joy
      gnss_fix: /fix
      navpvt: /navpvt
    joystick:
      config_package: pm_teleop
      teleop_config: config/teleop_twist_joy.yaml
      joy_config: config/joy_params.yaml
      # 試験時の左入力に表示を合わせるため、GUI上のX符号だけ反転する。
      axis_display_sign:
        x: -1.0
        y: 1.0
    camera:
      topic: /oak/color/image_raw
    attitude:
      urdf_path: ""
      pixels_per_meter: 240.0
    map:
      online_tiles_enabled: true
      tile_url_template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      user_agent: PatasmonkeyOperatorConsole/0.1
      tile_cache_dir: ~/.cache/pm_gui/osm
      offline_tiles_dir: /workspaces/patasmonkey_ws/maps/xyz
      attribution: © OpenStreetMap contributors
      zoom: 17
      gnss_history_points: 2000
    ui:
      refresh_hz: 4.0
      window_size: [1120, 780]
      fixed_window_size: false
      window_title: Patasmonkey UGV Operator Console (開発mock)
    recording:
      output_directory: /workspaces/patasmonkey_ws/bags/gui
      storage_id: mcap
      compression_mode: none
      compression_format: zstd
      max_bag_size_bytes: 1000000000
      stop_timeout_sec: 12.0
      low_disk_gib: 5.0
      external_recorder_node_name: rosbag2_recorder
      profiles:
        mission:
          topics:
            - /oak/color/image_raw
            - /oak/color/camera_info
            - /oak/imu/data
            - /odometry/global
            - /odometry/local
            - /fix
            - /navpvt
            - /pm/joy
            - /cmd_vel_joy
            - /tf
            - /tf_static
        debug:
          topics:
            - /oak/stereo/left/image_raw
            - /oak/stereo/right/image_raw
            - /oak/depth/image_raw
            - /oak/depth/camera_info
            - /motor_state
            - /wheel/odometry
            - /ov_msckf/odomimu
            - /vio/odometry
            - /fix/gated
            - /gnss/fix_gate/diagnostics
            - /navpvt
            - /navrelposned
            - /navstatus
            - /rtcm
            - /rxmrtcm
            - /diagnostics
            - /rosout
